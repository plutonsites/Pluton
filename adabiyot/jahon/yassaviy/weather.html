<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O‘zbekiston ob-havo</title>
<style>
body { font-family: Arial; }
.city { margin: 8px 0; }
</style>
</head>
<body>

<div id="weather"></div>

<script>
const API_KEY = "c3031c9e290537de3abc35b7696f5d16";

const cities = [
  "Andijon","Buxoro","Jizzax","Namangan","Qashqadaryo",
  "Surxondaryo","Xorazm","Toshkent","Navoiy",
  "Nukus","Farg'ona"
];

cities.forEach(city => {
  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},UZ&units=metric&appid=${API_KEY}`)
    .then(r => r.json())
    .then(d => {
      document.getElementById("weather").innerHTML +=
        `<div class="city">
          <b>${city}</b> — ${d.main.temp}°C, ${d.weather[0].description}
        </div>`;
    });
});
</script>

</body>
</html>
