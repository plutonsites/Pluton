<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Davlatlar Soati</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    padding:20px;
  }
  .clocks {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
  }
  .clock {
    background:#1e293b;
    padding:12px;
    border-radius:8px;
    text-align:center;
  }
  .name { font-size:16px; }
  .time { font-size:22px; font-weight:bold; }
</style>
</head>
<body>

<div class="clocks" id="clocks"></div>

<script>
const countries = [
  { name:"Afgʻoniston", tz:"Asia/Kabul" },
  { name:"Albaniya", tz:"Europe/Tirane" },
  { name:"AQSh (Vashington)", tz:"America/New_York" },
  { name:"Chicago, Texas", tz:"America/Chicago" },
  { name:"Avstraliya (Sidney)", tz:"Australia/Sydney" },
  { name:"Andorra", tz:"Europe/Andorra" },
  { name:"Oʻzbekiston", tz:"Asia/Tashkent" }
];

const box = document.getElementById("clocks");

countries.forEach(c => {
  const d = document.createElement("div");
  d.className = "clock";
  d.innerHTML = `
    <div class="name">${c.name}</div>
    <div class="time" id="${c.tz}">--:--:--</div>
  `;
  box.appendChild(d);
});

function update() {
  countries.forEach(c => {
    document.getElementById(c.tz).textContent =
      new Date().toLocaleTimeString("uz-UZ", {
        timeZone: c.tz,
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      });
  });
}

setInterval(update,1000);
update();
</script>

</body>
</html>
