<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tellurium (Te) Elektron Konfiguratsiyasi</title>

<style>
body{
  margin:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.atom{
  position:relative;
  width:800px;
  height:800px;
}

.nucleus{
  position:absolute;
  width:50px;
  height:50px;
  background:#f43f5e;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 25px #f43f5e;
}

.orbit{
  position:absolute;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.electron{
  position:absolute;
  width:7px;
  height:7px;
  background:#38bdf8;
  border-radius:50%;
  top:50%;
  left:50%;
}

</style>
</head>
<body>

<div class="atom" id="atom">
  <div class="nucleus"></div>
</div>

<script>

const atom = document.getElementById("atom");

function createOrbit(radius, electronCount, speed){
  const orbit = document.createElement("div");
  orbit.className="orbit";
  orbit.style.width=radius*2+"px";
  orbit.style.height=radius*2+"px";
  atom.appendChild(orbit);

  for(let i=0;i<electronCount;i++){
    const electron = document.createElement("div");
    electron.className="electron";
    orbit.appendChild(electron);

    let angle = (360/electronCount)*i;

    function animate(){
      angle += speed;
      electron.style.transform =
        `rotate(${angle}deg) translate(${radius}px) rotate(-${angle}deg)`;
      requestAnimationFrame(animate);
    }
    animate();
  }
}

/* ELEKTRON KONFIGURATSIYA */
/* 1s2 */
createOrbit(60,2,0.9);

/* 2s2 2p6 */
createOrbit(100,8,0.8);

/* 3s2 3p6 3d10 */
createOrbit(150,18,0.7);

/* 4s2 4p6 4d10 */
createOrbit(210,18,0.6);

/* 5s2 5p4 */
createOrbit(270,6,0.5);

</script>

</body>
</html>
