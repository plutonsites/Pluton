<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktiv Davriy Jadval</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin: 20px 0;
}

.periodic-table {
    display: grid;
    grid-template-columns: repeat(18, 60px);
    gap: 5px;
    justify-content: center;
}

.element {
    background: #1e293b;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
}

.element:hover {
    background: #3b82f6;
    transform: scale(1.05);
}

.element .number {
    font-size: 10px;
    position: absolute;
    top: 4px;
    left: 6px;
}

.element .symbol {
    font-size: 18px;
    font-weight: bold;
}

.element .name {
    font-size: 10px;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    text-align: left;
    position: relative;
}

.close {
    position: absolute;
    right: 10px;
    top: 5px;
    cursor: pointer;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>Interaktiv Davriy Jadval</h1>

<div class="periodic-table" id="periodicTable"></div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" id="closeModal">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ELEMENTLAR MA'LUMOTLARI
const elements = [
    {
        number: 1,
        symbol: "H",
        name: "Vodorod",
        mass: "1.008",
        category: "Nometall",
        description: "Eng yengil va eng oddiy element."
    },
    {
        number: 2,
        symbol: "He",
        name: "Geliy",
        mass: "4.0026",
        category: "Inert gaz",
        description: "Rangsiz, hidsiz va juda yengil gaz."
    },
    {
        number: 3,
        symbol: "Li",
        name: "Litiy",
        mass: "6.94",
        category: "Ishqoriy metall",
        description: "Yengil metall, batareyalarda ishlatiladi."
    },
    {
        number: 6,
        symbol: "C",
        name: "Uglerod",
        mass: "12.011",
        category: "Nometall",
        description: "Organik kimyoning asosi."
    },
    {
        number: 8,
        symbol: "O",
        name: "Kislorod",
        mass: "15.999",
        category: "Nometall",
        description: "Nafas olish uchun zarur gaz."
    }
];

// JADVALNI CHIZISH
const table = document.getElementById("periodicTable");

elements.forEach(el => {
    const div = document.createElement("div");
    div.className = "element";
    div.innerHTML = `
        <div class="number">${el.number}</div>
        <div class="symbol">${el.symbol}</div>
        <div class="name">${el.name}</div>
    `;
    div.addEventListener("click", () => openModal(el));
    table.appendChild(div);
});

// MODAL LOGIKA
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");
const closeModal = document.getElementById("closeModal");

function openModal(element) {
    modalContent.innerHTML = `
        <h2>${element.name} (${element.symbol})</h2>
        <p><strong>Atom raqami:</strong> ${element.number}</p>
        <p><strong>Atom massasi:</strong> ${element.mass}</p>
        <p><strong>Toifa:</strong> ${element.category}</p>
        <p><strong>Tavsif:</strong> ${element.description}</p>
    `;
    modal.style.display = "flex";
}

closeModal.onclick = () => modal.style.display = "none";

window.onclick = (e) => {
    if (e.target === modal) {
        modal.style.display = "none";
    }
};
</script>

</body>
</html>
