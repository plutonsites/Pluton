<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davriy Jadval</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1{
  margin:10px 0;
}

.table{
  display:grid;
  grid-template-columns:repeat(5,80px);
  
  justify-content:center;
}

.element{
  background:#1e293b;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}

.element:hover{
  background:#3b82f6;
  transform:scale(1.05);
}

.symbol{
  font-size:22px;
  font-weight:bold;
}

.number{
  font-size:12px;
}

.name{
  font-size:12px;
}

/* Modal */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#1e293b;
  padding:20px;
  border-radius:10px;
  width:300px;
  position:relative;
  text-align:left;
}

.close{
  position:absolute;
  right:10px;
  top:5px;
  font-size:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Interaktiv Davriy Jadval</h1>

<div class="table" id="table"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <span class="close" id="close">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>

<script>

// ELEMENTLAR
const elements = [
 {number:1,symbol:"H",name:"Vodorod",mass:"1.008",info:"Eng yengil element."},
 {number:2,symbol:"He",name:"Geliy",mass:"4.0026",info:"Inert gaz."},
 {number:3,symbol:"Li",name:"Litiy",mass:"6.94",info:"Ishqoriy metall."},
 {number:6,symbol:"C",name:"Uglerod",mass:"12.011",info:"Organik kimyo asosi."},
 {number:8,symbol:"O",name:"Kislorod",mass:"15.999",info:"Nafas olish uchun zarur gaz."}
];

const table = document.getElementById("table");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");
const closeBtn = document.getElementById("close");

// ELEMENTLARNI CHIZISH
elements.forEach(el=>{
  const div = document.createElement("div");
  div.className="element";
  div.innerHTML=`
    <div class="number">${el.number}</div>
    <div class="symbol">${el.symbol}</div>
    <div class="name">${el.name}</div>
  `;
  div.onclick=()=>showModal(el);
  table.appendChild(div);
});

// MODAL FUNKSIYA
function showModal(el){
  modalContent.innerHTML=`
    <h2>${el.name} (${el.symbol})</h2>
    <p><b>Atom raqami:</b> ${el.number}</p>
    <p><b>Atom massasi:</b> ${el.mass}</p>
    <p>${el.info}</p>
  `;
  modal.style.display="flex";
}

closeBtn.onclick=()=>modal.style.display="none";

window.onclick=(e)=>{
  if(e.target===modal){
    modal.style.display="none";
  }
}

</script>

</body>
</html>
