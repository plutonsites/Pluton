<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektron konfiguratsiya animatsiyasi</title>

<style>
body{
  margin:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  width: 90%;
  height:100vh;
  overflow:hidden;
}

.atom{
  position:relative;
  width:600px;
  height:600px;
}

.nucleus{
  position:absolute;
  width:40px;
  height:40px;
  background:#f43f5e;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 20px #f43f5e;
}

.orbit{
  position:absolute;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.electron{
  position:absolute;
  width:8px;
  height:8px;
  background:#38bdf8;
  border-radius:50%;
  top:50%;
  left:50%;
  transform-origin:center;
}

</style>
</head>
<body>

<div class="atom" id="atom">
  <div class="nucleus"></div>
</div>

<script>

const atom = document.getElementById("atom");

function createOrbit(radius, electronCount, speed){
  const orbit = document.createElement("div");
  orbit.className="orbit";
  orbit.style.width=radius*2+"px";
  orbit.style.height=radius*2+"px";
  atom.appendChild(orbit);

  for(let i=0;i<electronCount;i++){
    const electron = document.createElement("div");
    electron.className="electron";
    orbit.appendChild(electron);

    let angle = (360/electronCount)*i;

    function animate(){
      angle += speed;
      electron.style.transform=
        `rotate(${angle}deg) translate(${radius}px) rotate(-${angle}deg)`;
      requestAnimationFrame(animate);
    }
    animate();
  }
}

/* KONFIGURATSIYA */
/* 1s2 2s2 2p6 3s2 3p6 4s2 3d8 */

createOrbit(50,2,0.8);   // 1s2
createOrbit(90,2,0.7);   // 2s2
createOrbit(120,6,0.6);  // 2p6
createOrbit(160,2,0.5);  // 3s2
createOrbit(190,6,0.45); // 3p6
createOrbit(230,2,0.4);  // 4s2
createOrbit(280,8,0.35); // 3d8

</script>

</body>
</html>
