  <h1>📱 Mening PWA Saytim</h1>
  
  <p>Bu sayt ilova kabi ishlaydi 🚀</p>
  
  <b id="countdown"></b>

<script>
document.addEventListener("DOMContentLoaded", function () {

    function yilOxirigacha() {

        const hozir = new Date();

        // Keyingi yil 1-yanvar 00:00:00
        const keyingiYil = new Date(hozir.getFullYear() + 1, 0, 1, 0, 0, 0);

        const farq = keyingiYil - hozir;

        if (farq <= 0) {
            document.getElementById("countdown").textContent = "Yangi yil boshlandi!";
            return;
        }

        const kun = Math.floor(farq / (1000 * 60 * 60 * 24));
        const soat = Math.floor((farq / (1000 * 60 * 60)) % 24);
        const daqiqa = Math.floor((farq / (1000 * 60)) % 60);
        const soniya = Math.floor((farq / 1000) % 60);

        document.getElementById("countdown").textContent =
            "Yil tugashiga " +
            kun + "-k " +
            String(soat).padStart(2,'0') + " s " +
            String(daqiqa).padStart(2,'0') + " d " +
            String(soniya).padStart(2,'0') + " s qoldi.";
    }

    yilOxirigacha();
    setInterval(yilOxirigacha, 1000);

});
</script>
