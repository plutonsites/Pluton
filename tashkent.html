<b id="sidebar-info">
    Toshkent – 00:00:00 – 0°C
</b>

<script>
/* ===== SOZLAMALAR ===== */
const CITY_NAME = "Toshkent";
const API_KEY = "840a8ec0caec0104a8633e901bdd873b"; // OpenWeatherMap API kaliti
const CITY_QUERY = "Tashkent";

/* ===== HOLAT ===== */
let currentTemp = "°C";
let currentIcon = "";

/* ===== REAL VAQT (Toshkent) ===== */
function updateTime() {
    const now = new Date(
        new Date().toLocaleString("en-US", { timeZone: "Asia/Tashkent" })
    );

    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    updateLine(`${h}:${m}:${s}`);
}

setInterval(updateTime, 1000);

/* ===== OB-HAVO ===== */
function weatherIcon(main) {
    switch (main) {
        case "Clear": return "☀️";
        case "Clouds": return "☁️";
        case "Rain": return "🌧️";
        case "Drizzle": return "🌦️";
        case "Snow": return "❄️";
        case "Thunderstorm": return "⛈️";
        case "Mist":
        case "Fog": return "🌫️";
        default: return "🌡️";
    }
}

function updateLine(time) {
    document.getElementById("sidebar-info").textContent =
        `${CITY_NAME} – ${time} – ${currentIcon} ${currentTemp}`;
}

function fetchWeather() {
    fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY_QUERY}&units=metric&appid=${API_KEY}`)
        .then(res => res.json())
        .then(data => {
            currentTemp = Math.round(data.main.temp) + "°C";
            currentIcon = weatherIcon(data.weather[0].main);
        })
        .catch(() => {
            currentTemp = "--°C";
            currentIcon = "";
        });
}

/* ===== ISHGA TUSHIRISH ===== */
fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000); // 10 daqiqada yangilanadi
updateTime();
</script>
