<div id="sidebar-weather">
    <div id="uz-time">--:--:--</div>
    <div id="uz-date">---</div>
    <div id="uz-weather">
        <span id="weather-icon">⏳</span>
        <span id="weather-temp">--°C</span>
    </div>
</div>

<script>
/* ===== TOSHKENT REAL VAQTI ===== */
function updateTime() {
    const now = new Date();

    document.getElementById("uz-time").textContent =
        new Intl.DateTimeFormat("uz-UZ", {
            timeZone: "Asia/Tashkent",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }).format(now);

    document.getElementById("uz-date").textContent =
        new Intl.DateTimeFormat("uz-UZ", {
            timeZone: "Asia/Tashkent",
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }).format(now);
}

setInterval(updateTime, 1000);
updateTime();

/* ===== OB-HAVO (FAKAT BELGI + HARORAT) ===== */
const apiKey = "840a8ec0caec0104a8633e901bdd873b"; // OpenWeatherMap API kaliti
const city = "Tashkent";
const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

function weatherIcon(main) {
    switch (main) {
        case "Clear": return "☀️";
        case "Clouds": return "☁️";
        case "Rain": return "🌧️";
        case "Drizzle": return "🌦️";
        case "Snow": return "❄️";
        case "Thunderstorm": return "⛈️";
        case "Mist":
        case "Fog": return "🌫️";
        case "Wind": return "🌬️";
        default: return "🌡️";
    }
}

fetch(url)
    .then(res => res.json())
    .then(data => {
        document.getElementById("weather-icon").textContent =
            weatherIcon(data.weather[0].main);

        document.getElementById("weather-temp").textContent =
            Math.round(data.main.temp) + "°C";
    })
    .catch(() => {
        document.getElementById("weather-icon").textContent = "❌";
        document.getElementById("weather-temp").textContent = "";
    });
</script>
