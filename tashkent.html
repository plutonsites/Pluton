<b id="city-name">Toshkent</b>
<b id="city-time">00:00:00</b>
<b id="city-weather">0°C</b>

<script>
/* ===== SOZLAMALAR ===== */
const CITY_LABEL = "Toshkent";
const CITY_QUERY = "Tashkent";
const API_KEY = "YOUR_API_KEY"; // OpenWeatherMap API kaliti

/* ===== REAL VAQT (Toshkent) ===== */
function updateTime() {
    const now = new Date(
        new Date().toLocaleString("en-US", { timeZone: "Asia/Tashkent" })
    );

    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("city-time").textContent =
        `${h}:${m}:${s}`;
}

setInterval(updateTime, 1000);
updateTime();

/* ===== OB-HAVO ===== */
function weatherIcon(main) {
    switch (main) {
        case "Clear": return "☀️";
        case "Clouds": return "☁️";
        case "Rain": return "🌧️";
        case "Drizzle": return "🌦️";
        case "Snow": return "❄️";
        case "Thunderstorm": return "⛈️";
        case "Mist":
        case "Fog": return "🌫️";
        default: return "🌡️";
    }
}

function fetchWeather() {
    fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY_QUERY}&units=metric&appid=${API_KEY}`)
        .then(res => res.json())
        .then(data => {
            const temp = Math.round(data.main.temp) + "°C";
            const icon = weatherIcon(data.weather[0].main);

            document.getElementById("city-weather").textContent =
                `${icon} ${temp}`;
        })
        .catch(() => {
            document.getElementById("city-weather").textContent = "--°C";
        });
}

fetchWeather();
setInterval(fetchWeather, 10 * 60 * 1000);

/* ===== SHAHAR NOMI ===== */
document.getElementById("city-name").textContent = CITY_LABEL;
</script>
