<div id="sidebar-weather">
    <div id="uz-time">--:--:--</div>
    <div id="uz-date">---</div>
    <div id="uz-weather">
        <span id="weather-icon">⏳</span>
        <span id="weather-text">Yuklanmoqda...</span>
        <span id="weather-temp"></span>
    </div>
</div>

<script>
/* ===== REAL VAQT: Toshkent ===== */
function updateTime() {
    const now = new Date();

    const time = new Intl.DateTimeFormat('uz-UZ', {
        timeZone: 'Asia/Tashkent',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    }).format(now);

    const date = new Intl.DateTimeFormat('uz-UZ', {
        timeZone: 'Asia/Tashkent',
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    }).format(now);

    document.getElementById('uz-time').textContent = time;
    document.getElementById('uz-date').textContent = date;
}

setInterval(updateTime, 1000);
updateTime();

/* ===== OB-HAVO ===== */
const apiKey = "840a8ec0caec0104a8633e901bdd873b"; // OpenWeatherMap API kaliti
const city = "Tashkent";
const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&lang=uz&appid=${apiKey}`;

function getWeatherIcon(main) {
    switch (main) {
        case "Clear": return "☀️";
        case "Clouds": return "☁️";
        case "Rain": return "🌧️";
        case "Drizzle": return "🌦️";
        case "Snow": return "❄️";
        case "Thunderstorm": return "⛈️";
        case "Wind": return "🌬️";
        default: return "🌡️";
    }
}

fetch(url)
    .then(res => res.json())
    .then(data => {
        const temp = Math.round(data.main.temp);
        const description = data.weather[0].description;
        const mainWeather = data.weather[0].main;

        document.getElementById('weather-icon').textContent =
            getWeatherIcon(mainWeather);

        document.getElementById('weather-text').textContent =
            description;

        document.getElementById('weather-temp').textContent =
            ` (${temp}°C)`;
    })
    .catch(() => {
        document.getElementById('weather-text').textContent =
            "Ob-havo mavjud emas";
    });
</script>
