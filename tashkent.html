<div id="sidebar-weather">
    <div id="uz-time">--:--:--</div>
    <div id="uz-date">--.--.----</div>
    <div id="uz-weather">
        <span id="weather-icon">⏳</span>
        <span id="weather-temp">--°C</span>
    </div>
</div>

<script>
/* ===== TOSHKENT REAL VAQTI (RAQAMLI) ===== */
function updateTime() {
    const now = new Date(
        new Date().toLocaleString("en-US", { timeZone: "Asia/Tashkent" })
    );

    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    const d = String(now.getDate()).padStart(2, "0");
    const mo = String(now.getMonth() + 1).padStart(2, "0");
    const y = now.getFullYear();

    document.getElementById("uz-time").textContent =
        `${h}:${m}:${s}`;

    document.getElementById("uz-date").textContent =
        `${d}.${mo}.${y}`;
}

setInterval(updateTime, 1000);
updateTime();

/* ===== OB-HAVO (FAKAT BELGI + HARORAT) ===== */
const apiKey = "YOUR_API_KEY"; // OpenWeatherMap API kaliti
const city = "Tashkent";
const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

function weatherIcon(main) {
    switch (main) {
        case "Clear": return "☀️";
        case "Clouds": return "☁️";
        case "Rain": return "🌧️";
        case "Drizzle": return "🌦️";
        case "Snow": return "❄️";
        case "Thunderstorm": return "⛈️";
        case "Mist":
        case "Fog": return "🌫️";
        case "Wind": return "🌬️";
        default: return "🌡️";
    }
}

fetch(url)
    .then(res => res.json())
    .then(data => {
        document.getElementById("weather-icon").textContent =
            weatherIcon(data.weather[0].main);

        document.getElementById("weather-temp").textContent =
            Math.round(data.main.temp) + "°C";
    })
    .catch(() => {
        document.getElementById("weather-icon").textContent = "❌";
        document.getElementById("weather-temp").textContent = "";
    });
</script>
